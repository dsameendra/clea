# Sites indexed by the public GitHub Pages demo (.github/workflows/pages.yml).
# Locally you can load them with:  python -m clea sites import sites.toml
#
# Each seed URL is crawled within its host and below its directory, e.g.
# https://docs.python.org/3/tutorial/ stays inside /3/tutorial/.
# Keep the totals modest: the whole index is downloaded by the browser
# (roughly 6 KB per page before compression; ~400 pages is about 2.4 MB).

[defaults]
max_pages = 60
max_depth = 3

[[site]]
url = "https://docs.python.org/3/tutorial/"

[[site]]
url = "https://flask.palletsprojects.com/en/stable/"
max_pages = 120

[[site]]
url = "https://react.dev/learn"
path_prefix = "/learn"   # override the derived scope ("/"), keep to the tutorial
max_pages = 80

[[site]]
url = "https://sqlite.org/docs.html"
max_pages = 150
max_depth = 2
