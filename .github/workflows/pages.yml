# Builds the static demo: crawls the sites in sites.toml, exports the index as
# JSON and publishes it with the frontend (search runs in the browser).
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  schedule:
    - cron: "17 3 * * 1" # weekly (Monday 03:17 UTC): recrawl to pick up changes
  workflow_dispatch:
    inputs:
      recrawl:
        description: "Re-fetch every page (otherwise only new pages are crawled)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      # Keep the database between runs so recrawls can use conditional requests.
      - name: Restore index
        uses: actions/cache@v6
        with:
          path: data/clea.db
          key: clea-index-${{ github.run_id }}
          restore-keys: clea-index-

      - name: Crawl
        env:
          CLEA_CRAWLER_CONTACT: https://github.com/${{ github.repository }}
        run: |
          python -m clea sites import sites.toml --prune
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.recrawl }}" = "true" ]; then
            python -m clea crawl --recrawl --max-seconds 1800
          else
            python -m clea crawl --max-seconds 1800
          fi
          python -m clea stats

      - id: pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_PUBLIC_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          npm ci
          npm run build:static

      # Fails the run (keeping the previous deployment) if the crawl produced an empty index.
      - name: Export index
        run: python -m clea export frontend/dist/data --min-documents 20

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
